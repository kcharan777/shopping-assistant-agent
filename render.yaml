services:
  # Backend API Web Service
  - type: web
    name: shopagent-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: "*"

  # Frontend Static Web Site
  - type: web
    name: shopagent-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: shopagent-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /api/*
        destination: https://shopagent-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

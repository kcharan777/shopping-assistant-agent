<!DOCTYPE html>
<html>
<head>
    <title>Shopping Assistant</title>
</head>

<body>

<h2>Shopping Assistant</h2>

<input
    id="question"
    type="text"
    placeholder="Enter your shopping request"
    style="width:400px;padding:10px;"
>

<button onclick="askAssistant()">Ask</button>

<pre id="answer"></pre>

<script>

async function askAssistant() {

    const question =
        document.getElementById("question").value;

    const answerBox =
        document.getElementById("answer");

    answerBox.textContent = "Thinking...";

    try {

        const response = await fetch("/agent/invoke", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                input: {
                    input: question
                }
            })

        });

        const data = await response.json();

        let answer = data.output;

        if (Array.isArray(answer)) {

            const textBlock =
                answer.find(item => item.type === "text");

            answer =
                textBlock ? textBlock.text : "";

        }

        else if (
            answer &&
            typeof answer === "object"
        ) {

            if (typeof answer.text === "string") {
                answer = answer.text;
            }

            else if (typeof answer.content === "string") {
                answer = answer.content;
            }

            else {
                answer = JSON.stringify(answer);
            }
        }

        answerBox.textContent = answer;

    }

    catch (error) {

        answerBox.textContent =
            "Error: " + error.message;

    }

}

</script>

</body>
</html>
